name: ci 

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        # see https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        # see https://github.com/actions/setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
          # pip downloads, keyed on requirements.txt
          cache: pip
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Build and deploy the branch gh-pages
        # https://www.mkdocs.org/user-guide/deploying-your-docs/
        # hooks/sibils_data.py reads the collection counts and the vocabularies
        # from the SIBiLS API, or the snapshots in data/ if the API is down.
        # Warnings (broken link or anchor, unknown citation key...) are shown
        # in the log but do not stop the deployment; run `mkdocs build
        # --strict` locally to catch them before pushing.
        run: mkdocs gh-deploy --force
      - name: Deploy on sibils.org
        # CURL options:
        # -f : GitHub workflow fail if the HTTP status code is not 200
        # see https://infra.text-analytics.ch/devdoc/tools/gh_update/
        # ${{ github.repository }} is replaced by the repository name, for example bitem-heg-geneve/bicikl-fair-data-place
        # CURL options:
        # -f : GitHub workflow fail if the HTTP status code is not 200
        # Endpoint: update_from_git service on webstatic
        run: |
          curl -f -X 'POST' "https://deploy.text-analytics.ch/deploy/github.com/${{ github.repository }}/gh-pages" \
               -H 'accept: application/json' \
               -H 'Content-Type: application/x-www-form-urlencoded' \
               -d 'secret_key=${{secrets.SECRET_KEY}}'
